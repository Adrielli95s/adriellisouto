<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Site da Adrielliellinha linda 🎉</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a1c4fd, #c2e9fb);
      background-size: 400% 400%;
      animation: gradiente 10s ease infinite;
      text-align: center;
    }
    @keyframes gradiente {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    h1 {
      font-size: 3em;
      color: #333;
      text-shadow: 2px 2px 8px rgba(255,255,255,0.7);
    }
    p {
      font-size: 1.3em;
      color: #444;
    }
    button {
      margin-top: 20px;
      padding: 15px 30px;
      font-size: 1.1em;
      border: none;
      border-radius: 50px;
      background: #ff6b81;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }
    button:hover {
      transform: scale(1.1);
    }
    #mensagem {
      margin-top: 20px;
      font-size: 1.5em;
      min-height: 40px;
    }
  </style>
</head>
<body>
  <h1>Bem-vindos ao meu site! 🚀</h1>
  <p>Feito por mim, direto pelo navegador, sem instalar nada.</p>
  <button onclick="surpresa()">Clique aqui 🎁</button>
  <div id="mensagem"></div>

  <script>
    const frases = [
      "Você é incrível! ✨",
      "Bora aprender programação juntos? 💻",
      "Esse site foi feito 100% pelo GitHub! 🐙",
      "Continue explorando, tem muito mais pra aprender! 🚀",
      "Adrielli tá dominando o Git! 🔥"
    ];
    function surpresa() {
      const frase = frases[Math.floor(Math.random() * frases.length)];
      document.getElementById("mensagem").innerText = frase;
    }
  </script>
</body>
</html>
